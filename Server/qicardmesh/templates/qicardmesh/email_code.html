<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quarbor Logic 奇桦科技-验证码</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;color:#172b46;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;"><tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
      <tr><td style="padding:30px 32px;background:#142e50;border-top:5px solid #38bdf8;">
        <div style="font-size:12px;font-weight:600;letter-spacing:3px;color:#7dd3fc;">QUARBOR LOGIC</div>
        <div style="margin-top:8px;font-size:24px;font-weight:700;color:#ffffff;">奇桦科技</div>
      </td></tr>
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">验证邮箱，继续登录</h1>
        <p style="margin:0 0 24px;color:#526580;font-size:15px;line-height:1.8;">您好，请在登录页面输入下方验证码，完成本次身份验证。</p>
        <div style="padding:24px 12px;text-align:center;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;">
          <div style="font-size:12px;color:#526580;letter-spacing:2px;">您的专属验证码</div>
          <div style="margin-top:12px;font-family:Consolas,monospace;font-size:36px;line-height:1.4;font-weight:700;letter-spacing:8px;color:#1d4ed8;">{{ email_code }}</div>
        </div>
        <p style="margin:24px 0 0;font-size:14px;color:#526580;line-height:1.8;">验证码在 <strong style="color:#172b46;">{{ expires_minutes }} 分钟</strong>内有效，仅可使用一次。请勿向任何人透露或转发验证码。</p>
        <p style="margin:12px 0 0;font-size:13px;color:#718096;line-height:1.8;">如果这不是您本人的操作，请忽略此邮件。</p>
      </td></tr>
      <tr><td style="padding:20px 32px;border-top:1px solid #e2e8f0;font-size:12px;color:#718096;line-height:1.8;">Quarbor Logic 奇桦科技<br>此邮件由系统自动发送，请勿直接回复。</td></tr>
    </table>
  </td></tr></table>
</body>
</html>
