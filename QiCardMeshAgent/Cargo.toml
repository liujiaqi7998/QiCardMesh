[package]
name = "qicardmesh-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform PC/SC CLI for QiCardMesh"

[[bin]]
name = "qicardmesh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
pcsc = "2.9"
prost = "0.14"
rumqttc = { version = "0.25", features = ["url"] }
qicardmesh-mqtt-protocol = { path = "../protocol/mqtt" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
url = "2"
