syntax = "proto3";

package qicardmesh.mqtt.v1;

// Requests and responses are published as binary protobuf payloads on
// QiCardMesh/device/<user_id>/method. A response carries the same request_id
// as its request, allowing several clients to share one topic safely.

enum Method {
  METHOD_UNSPECIFIED = 0;
  LIST_CARDS = 1;
  GET_CARD = 2;
  TRANSMIT_APDU = 3;
}

enum StatusCode {
  STATUS_OK = 0;
  INVALID_ARGUMENT = 1;
  NOT_FOUND = 2;
  CARD_UNAVAILABLE = 3;
  PCSC_ERROR = 4;
  APDU_ERROR = 5;
  BUSY = 6;
  INTERNAL_ERROR = 7;
}

message MethodRequest {
  uint32 protocol_version = 1;
  string request_id = 2;
  Method method = 3;
  // Responses are published on the same method topic. This marker prevents
  // a client from treating its own response as a new APDU request.
  bool is_response = 6;

  oneof payload {
    ListCardsRequest list_cards = 10;
    GetCardRequest get_card = 11;
    TransmitApduRequest transmit_apdu = 12;
  }
}

message MethodResponse {
  uint32 protocol_version = 1;
  string request_id = 2;
  Method method = 3;
  StatusCode status = 4;
  string error_message = 5;
  bool is_response = 6;

  oneof payload {
    ListCardsResponse list_cards = 10;
    GetCardResponse get_card = 11;
    TransmitApduResponse transmit_apdu = 12;
  }
}

message ListCardsRequest {
  // Include readers with no card present when true. The default only returns
  // cards currently present in a reader.
  bool include_empty_readers = 1;
}

message ListCardsResponse {
  repeated CardSummary cards = 1;
}

message GetCardRequest {
  string card_id = 1;
  // Ask the agent to refresh ATR/metadata before returning the details.
  bool refresh = 2;
}

message GetCardResponse {
  CardDetails card = 1;
}

message TransmitApduRequest {
  string card_id = 1;
  // Commands are executed in order by the agent's serial APDU executor. The
  // executor stops at the first non-9000 response and returns prior replies.
  repeated bytes commands = 2;
  uint32 timeout_ms = 3;
}

message TransmitApduResponse {
  repeated ApduResult responses = 1;
  bool transaction_complete = 2;
}

message ApduResult {
  bytes response = 1;
  uint32 status_word = 2;
  string error_message = 3;
}

enum CardKind {
  CARD_KIND_UNKNOWN = 0;
  SMART_CARD = 1;
  YUBIKEY = 2;
  CANOKEY = 3;
}

// Stable summary used in list responses and card connect/disconnect events.
message CardSummary {
  string card_id = 1;
  string reader_name = 2;
  CardKind kind = 3;
  bytes atr = 4;
  bool present = 5;
  bool connected = 6;
  uint32 generation = 7;
  string protocol = 8;
  string firmware = 9;
  string serial = 10;
}

message CardDetails {
  CardSummary summary = 1;
  string vendor = 2;
  string model = 3;
  string version = 4;
  string openpgp_aid = 5;
  map<string, string> attributes = 6;
}

enum NotifyEvent {
  NOTIFY_EVENT_UNSPECIFIED = 0;
  DEVICE_ONLINE = 1;
  CARD_CONNECTED = 2;
  CARD_DISCONNECTED = 3;
  CARD_CHANGED = 4;
  DEVICE_OFFLINE = 5;
}

// Asynchronous notifications are published on .../<user_id>/notify. The
// online event is sent after MQTT connection succeeds; card events are emitted
// whenever the monitor observes a reader/card state change.
message Notify {
  uint32 protocol_version = 1;
  string event_id = 2;
  NotifyEvent event = 3;
  int64 timestamp_unix_ms = 4;
  string user_id = 5;
  string reason = 6;

  oneof payload {
    DeviceInfo device = 10;
    CardSummary card = 11;
    CardSnapshot snapshot = 12;
  }
}

message DeviceInfo {
  string agent_version = 1;
  string hostname = 2;
  string platform = 3;
}

message CardSnapshot {
  repeated CardSummary cards = 1;
}
